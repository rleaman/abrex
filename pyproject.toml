[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "abrex"
version = "0.1.0"
description = "A modular framework for abbreviation resolution and expansion extraction."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Abbreviation Resolution Project" }]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
jev = [
  "typesafe-sdk==0.7.2",
]
dev = [
  "mypy==1.15.0",
  "playwright>=1.55,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff==0.11.13",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
abrex = "abrex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/abrex"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/abrex/literature/reviewer_ui.py" = ["E501"]
"src/abrex/literature/blind_reviewer_ui.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
source = ["abrex"]
# These modules are process, browser, network, filesystem, or optional-runtime
# adapters. Their behavior is covered by focused contract/integration tests and
# recorded smoke evidence; the 95% floor applies to the scientific/domain core.
# See docs/coverage-policy.md.
omit = [
  "src/abrex/candidates/serialization.py",
  "src/abrex/cli/*",
  "src/abrex/corpora/adapters/historical.py",
  "src/abrex/infrastructure/*",
  "src/abrex/jobs/service.py",
  "src/abrex/literature/audit_inventory.py",
  "src/abrex/literature/io.py",
  "src/abrex/literature/pilot.py",
  "src/abrex/literature/pilot_methods.py",
  "src/abrex/literature/pilot_sampling.py",
  "src/abrex/literature/pilot_sources.py",
  "src/abrex/literature/pilot_worker.py",
  "src/abrex/literature/review.py",
  "src/abrex/literature/review_packet.py",
  "src/abrex/literature/runtime_readiness.py",
  "src/abrex/literature/service.py",
  "src/abrex/resolvers/adapters/ab3p_resolver.py",
  "src/abrex/resolvers/plod.py",
]

[tool.coverage.report]
# 95% is the repository-wide floor; defensive failure branches are exercised
# by focused component tests and remain visible in the coverage report.
fail_under = 95
show_missing = true
