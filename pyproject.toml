[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "abrex"
version = "0.1.0"
description = "A modular framework for abbreviation resolution and expansion extraction."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Abbreviation Resolution Project" }]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff==0.11.13",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
abrex = "abrex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/abrex"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/abrex/literature/reviewer_ui.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
source = ["abrex"]

[tool.coverage.report]
# 95% is the repository-wide floor; defensive failure branches are exercised
# by focused component tests and remain visible in the coverage report.
fail_under = 95
show_missing = true
