name: Offline core quality

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked development environment
        run: |
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-deps --editable .
      - name: Import and CLI smoke
        run: |
          python -c "import abrex; print(abrex.__name__)"
          python -m abrex --help
      - name: Gate failure-path check
        run: python scripts/quality_gate.py --self-test
      - name: Full offline quality gate
        run: python scripts/quality_gate.py --full
