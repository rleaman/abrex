project:
  name: campaign-2026-10-direct-extraction
  seed: 20261005
corpus:
  type: canonical_jsonl
  params:
    path: evidence/campaign-2026-10/milestone-b/t062-development.jsonl
    manifest_path: evidence/campaign-2026-10/milestone-b/t062-development.manifest.json
resolver:
  type: openai_direct_extraction
  error_policy: collect
  params:
    model: ${AZURE_OPENAI_DEPLOYMENT}
    policy_version: source-grounded-direct-v1
    prompt_version: abrex-direct-extraction-2026-10-05-v1
    reasoning_effort: medium
    cache_path: evidence/campaign-2026-10/milestone-b/direct-extraction-cache.jsonl
    cache_only: false
    provider: azure_openai
    endpoint: ${AZURE_OPENAI_ENDPOINT}
    api_key_env: AZURE_OPENAI_API_KEY
    maximum_document_characters: 48000
    maximum_network_attempts: 20
    maximum_estimated_input_tokens: 25000
    maximum_output_tokens_per_request: 4096
    monetary_cap_usd: 0.045
    input_usd_per_million_tokens: !env AZURE_OPENAI_INPUT_USD_PER_MILLION_TOKENS
    output_usd_per_million_tokens: !env AZURE_OPENAI_OUTPUT_USD_PER_MILLION_TOKENS
    timeout_seconds: 60
    retries: 0
matching:
  type: exact_pair
  params: {}
metrics:
  - type: pair_prf
    params:
      averaging: micro
      zero_division: zero
reporters:
  - type: json
    params: {}
  - type: error_table
    params: {}
  - type: html_error_report
    params:
      context_chars: 160
output:
  root: .artifacts/campaign-2026-10/direct-extraction
  reuse_cached_predictions: true
