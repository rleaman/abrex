project:
  name: historical-sdu-aaai21-ai

corpus:
  adapter:
    type: sdu_aaai21_ai
    params: {}
  source:
    identifier: sdu_aaai21_ai_train
    location: data/raw/historical/sdu_aaai21_ai/train.json
    format: json
  normalizers:
    - type: identity
      params: {}
  strict: false
  semantics:
    annotation_unit: paired_definition
    relation_policy: token_BIO_labels
    coordinate_convention: reconstructed_unicode_python_half_open
    official_split: train (dev/test are separate official files)
    eligible_metric: exact_pair
    source_status: user_managed_local
    source_version: AAAI-21 SDU shared-task dataset
    license_status: repository terms require local review
  output:
    directory: data/processed/sdu_aaai21_ai
    jsonl: canonical.jsonl
    manifest: manifest.json
