project:
  name: historical-schwartz-hearst

corpus:
  adapter:
    type: schwartz_hearst
    params:
      pairing_policy: relations_or_order_fallback
      text_policy: preserve_source
      location_policy: first_location
  source:
    identifier: schwartz_hearst
    location: data/raw/historical/schwartz_hearst/SH_bioc_gold.xml
    format: xml
  normalizers:
    - type: identity
      params: {}
  strict: false
  semantics:
    annotation_unit: paired_definition
    relation_policy: relations_or_order_fallback
    coordinate_convention: unicode_python_half_open
    official_split: corpus_defined
    eligible_metric: exact_pair
    source_status: user_managed_local
    source_version: BioC archive as acquired; raw-file fingerprint is recorded at build time
    license_status: source terms require local review
  output:
    directory: data/processed/schwartz_hearst
    jsonl: canonical.jsonl
    manifest: manifest.json
