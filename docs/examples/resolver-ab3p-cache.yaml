# Linux cache population (Ab3P is an external, pre-installed executable).
resolver:
  type: ab3p
  params:
    backend: subprocess
    timeout_seconds: 60
    installation:
      manifest: ${AB3P_INSTALLATION_MANIFEST}
      root: ${AB3P_INSTALLATION_ROOT}
      executable: identify_abbr
      resource_directory: WordData
    cache:
      path: artifacts/ab3p-cache
      read: true
      write: true
